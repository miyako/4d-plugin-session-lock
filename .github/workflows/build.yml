name: Build and test

on:
  push:
    branches-ignore: [miyako-session-lock-plugin]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      source-sha: ${{ github.sha }}
